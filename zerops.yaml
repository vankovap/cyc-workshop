zerops:
  - setup: api
    build:
      base: nodejs@22
      os: ubuntu
      buildCommands:
        - npm ci
        - npm run build -w @deck/api
      deployFiles: [.]
      cache:
        - node_modules
    run:
      base: nodejs@22
      os: ubuntu
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        PORT: 3000
        HOST: 0.0.0.0
        NODE_ENV: production
        APP_URL: ${frontend_zeropsSubdomain}
        DATABASE_URL: ${db_connectionString}/${db_dbName}
        NATS_HOST: ${queue_hostname}
        NATS_PORT: ${queue_port}
        NATS_USER: ${queue_user}
        NATS_PASSWORD: ${queue_password}
        VALKEY_URL: ${cache_connectionString}
      start: npm run start -w @deck/api
      healthCheck:
        httpGet:
          port: 3000
          path: /health

  - setup: worker
    build:
      base: nodejs@22
      os: ubuntu
      buildCommands:
        - npm ci
        - npm run build -w @deck/worker
      deployFiles: [.]
      cache:
        - node_modules
    run:
      base: nodejs@22
      os: ubuntu
      prepareCommands:
        - sudo apt-get update
        - sudo apt-get install -y wget gnupg ca-certificates fonts-liberation fonts-dejavu-core fonts-noto-color-emoji
        - wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        - sudo apt-get install -y /tmp/chrome.deb
        - rm -f /tmp/chrome.deb
      envVariables:
        NODE_ENV: production
        RENDER_DRIVER: chromium
        CHROMIUM_PATH: /usr/bin/google-chrome-stable
        DATABASE_URL: ${db_connectionString}/${db_dbName}
        NATS_HOST: ${queue_hostname}
        NATS_PORT: ${queue_port}
        NATS_USER: ${queue_user}
        NATS_PASSWORD: ${queue_password}
        VALKEY_URL: ${cache_connectionString}
      start: npm run start -w @deck/worker

  - setup: frontend
    build:
      base: nodejs@22
      os: ubuntu
      buildCommands:
        - npm ci
        - npm run build -w @deck/frontend
      deployFiles: [.]
      cache:
        - node_modules
      envVariables:
        VITE_API_URL: https://api-2f7f-3000.prg1.zerops.app
    run:
      base: nginx@1.22
      documentRoot: apps/frontend/dist
